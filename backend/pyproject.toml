[project]
name = "tour-sri-backend"
version = "0.1.0"
description = "FastAPI backend for the Sri Lanka travel web app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",   # ASGI server that runs FastAPI
    "pydantic-settings>=2.6",    # Typed settings loaded from env vars / .env
    "sqlalchemy[asyncio]>=2.0",  # ORM + async engine (models come in Phase 1)
    "asyncpg>=0.30",             # Async PostgreSQL driver used by SQLAlchemy
    "alembic>=1.14",             # Database migrations (versioned schema changes)
    "pgvector>=0.3",             # SQLAlchemy Vector type (used from Phase 5)
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",               # Used by FastAPI's TestClient
]

