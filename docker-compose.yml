# Development setup. Start everything with: docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16   # PostgreSQL 16 with the pgvector extension
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container restarts
    ports:
      - "5432:5432"                       # exposed in dev only (for DB tools)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      # "db" is the service name: Docker's internal DNS resolves it to the db container.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - ./backend:/app                    # mount source for hot reload
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy        # wait until Postgres accepts connections

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      INTERNAL_API_URL: http://backend:8000 # used by Next.js Server Components inside Docker
      WATCHPACK_POLLING: "true"           # reliable file watching inside Docker
    volumes:
      - ./frontend:/app                   # mount source for hot reload
      - /app/node_modules                 # keep the container's node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:

